<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conflux Graphics — Animated Banner Maker</title>
<style>
:root{--bg:#07070b;--panel:#11111a;--panel2:#171722;--line:#29293a;--text:#f7f7fb;--muted:#9999aa;--p:#8b5cf6;--c:#06b6d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d1239 0,#07070b 38%),#07070b;color:var(--text);font-family:Inter,system-ui,sans-serif}
a{color:inherit}.top{height:64px;border-bottom:1px solid #20202d;background:#090910dd;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px;letter-spacing:-.5px}.brand i{color:var(--p);font-style:normal}.nav{display:flex;gap:18px;color:#bbb; font-size:14px}.wrap{max-width:1250px;margin:auto;padding:42px 22px 70px}.hero{text-align:center;margin:12px auto 36px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:0 0 14px;letter-spacing:-2.5px}.hero h1 span{background:linear-gradient(90deg,var(--p),var(--c));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:16px;margin:0}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:linear-gradient(180deg,#14141e,#0e0e15);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #0007}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tpl{padding:0;border:1px solid var(--line);background:#0d0d14;border-radius:14px;overflow:hidden;cursor:pointer;color:white;text-align:left}.tpl.active{border-color:var(--p);box-shadow:0 0 0 1px #8b5cf655}.thumb{height:90px;display:grid;place-items:center;font-weight:900;font-size:18px;letter-spacing:1px}.t1{background:radial-gradient(circle at 20% 50%,#8b5cf6,#111 55%),#111}.t2{background:repeating-linear-gradient(135deg,#111 0 12px,#06b6d4 13px 15px,#111 16px 28px)}.t3{background:radial-gradient(circle,#06b6d4 0 4%,transparent 5%),radial-gradient(circle,#8b5cf6 0 3%,transparent 4%),#09090d;background-size:35px 35px,55px 55px}.t4{background:linear-gradient(120deg,#ff0080,#7c3aed,#06b6d4)}.t5{background:radial-gradient(circle at 70% 30%,#fff,#8b5cf6 3%,transparent 15%),#050507}.t6{background:linear-gradient(90deg,#050505,#222,#050505)}.tpl b{display:block;padding:10px 11px;font-size:13px}.controls{display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#aaa}.field input,.field select{width:100%;border:1px solid var(--line);background:#0a0a10;color:white;border-radius:10px;padding:11px 12px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color{height:44px;padding:3px!important}.check{display:flex;align-items:center;gap:8px;color:#bbb;font-size:13px}.preview{margin-top:18px;background:#07070b;border:1px solid var(--line);border-radius:14px;padding:12px}.preview canvas{width:100%;display:block;border-radius:9px;image-rendering:auto}.actions{display:flex;gap:10px;margin-top:13px}.btn{flex:1;border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,var(--p),var(--c));color:white}.secondary{background:#222231;color:white;border:1px solid var(--line)}.status{font-size:12px;color:#888;margin-top:9px;min-height:16px}.section-title{font-weight:800;margin-bottom:13px}.note{margin-top:14px;padding:12px;border-radius:12px;background:#0b0b12;border:1px solid #222235;color:#999;font-size:12px;line-height:1.5}@media(max-width:900px){.grid{grid-template-columns:1fr}.templates{grid-template-columns:repeat(2,1fr)}.nav{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i>✦</i> Conflux Graphics</div><nav class="nav"><span>Discord</span><span>Templates</span><span>Tools</span></nav></header>
<main class="wrap">
<section class="hero"><h1>Animated <span>Graphics Maker</span></h1><p>Tạo banner Discord động ngay trên trình duyệt — không cần phần mềm.</p></section>
<div class="grid">
<section class="card">
  <div class="section-title">Chọn template</div>
  <div class="templates" id="templates"></div>
  <div class="preview">
    <canvas id="canvas" width="600" height="240"></canvas>
    <div class="actions"><button class="btn primary" id="render">Render GIF</button><button class="btn secondary" id="png">Tải PNG</button></div>
    <div class="status" id="status">Preview đang chạy.</div>
  </div>
</section>
<section class="card">
  <div class="section-title">Tùy chỉnh</div>
  <div class="controls">
    <div class="field"><label>Tên / nội dung</label><input id="text" value="CONFLUX" maxlength="28"></div>
    <div class="row">
      <div class="field"><label>Màu chính</label><input class="color" type="color" id="color1" value="#8b5cf6"></div>
      <div class="field"><label>Màu phụ</label><input class="color" type="color" id="color2" value="#06b6d4"></div>
    </div>
    <div class="row">
      <div class="field"><label>Font</label><select id="font"><option>Arial</option><option>Inter</option><option>Georgia</option><option>Courier New</option></select></div>
      <div class="field"><label>Hiệu ứng</label><select id="effect"><option value="normal">Normal</option><option value="rainbow">Rainbow</option><option value="bw">Black & White</option><option value="glitch">Glitch</option></select></div>
    </div>
    <label class="check"><input id="overlay" type="checkbox" checked> Hiển thị khung Discord mockup</label>
    <div class="note">Kích thước xuất mặc định <b>600×240</b>, đúng tỉ lệ banner Discord. GIF được tạo hoàn toàn phía trình duyệt bằng GIF.js.</div>
  </div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const templates=[
 ['GIF 1','https://www.image2url.com/r2/default/gifs/1791431223551-90fd0ee1-82cf-46d3-95b3-e38a24de549f.gif'],
 ['GIF 2','https://www.image2url.com/r2/default/gifs/1791431279152-5d8386c4-254c-4a5c-8a69-a282d72eaa8f.gif'],
 ['GIF 3',''],['GIF 4',''],['GIF 5',''],['GIF 6',''],['GIF 7','']
];
const state={tpl:0};
const cvs=document.getElementById('canvas'),ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);
templates.forEach((t,i)=>{
 let b=document.createElement('button');
 b.className='tpl '+(i===0?'active':'');
 b.innerHTML=t[1]
   ? `<div class="thumb" style="padding:0"><img src="${t[1]}" alt="${t[0]}" style="width:100%;height:90px;object-fit:cover;display:block" loading="lazy"></div><b>${t[0]}</b>`
   : `<div class="thumb" style="display:grid;place-items:center;background:#111">${t[0]}</div><b>${t[0]}</b>`;
 b.onclick=()=>{
   state.tpl=i;
   document.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
   if(t[1]) showRemoteGif(t[1],t[0]);
 };
 $('templates').appendChild(b);
});

function showRemoteGif(url,name){
 const old=document.getElementById('remotePreview');
 if(old) old.remove();
 const img=document.createElement('img');
 img.id='remotePreview';
 img.src=url;
 img.alt=name;
 img.style='width:100%;display:block;border-radius:9px;object-fit:contain;background:#050508;';
 img.onerror=()=>{ $('status').textContent='Không tải được '+name+'. Kiểm tra link GIF.'; };
 const holder=cvs.parentElement;
 cvs.style.display='none';
 holder.insertBefore(img,cvs);
 $('status').textContent='Đang xem '+name+'.';
}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function lerp(a,b,t){return a+(b-a)*t}
function draw(t=0){
 const W=600,H=240,c1=hexRgb($('color1').value),c2=hexRgb($('color2').value),name=$('text').value||'CONFLUX';
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);
 const p=state.tpl, time=t/1000;
 if(p===0){let g=ctx.createRadialGradient(300,120,5,300,120,340);g.addColorStop(0,`rgb(${c1})`);g.addColorStop(.35,`rgb(${c2})`);g.addColorStop(1,'#050508');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<18;i++){ctx.beginPath();ctx.strokeStyle=`rgba(${c1},${.18+i/80})`;ctx.lineWidth=2;ctx.arc(300,120,20+i*18+Math.sin(time*2+i)*7,0,Math.PI*1.55);ctx.stroke()}}
 if(p===1){for(let i=-20;i<650;i+=32){ctx.strokeStyle=i%64?`rgb(${c2})`:`rgb(${c1})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(i+Math.sin(time)*25,0);ctx.lineTo(i-180+Math.cos(time+i)*25,240);ctx.stroke()}}
 if(p===2){for(let i=0;i<80;i++){let x=(i*83+t*.04*(i%3+1))%650-25,y=(i*47)%240;ctx.fillStyle=i%2?`rgb(${c1})`:`rgb(${c2})`;ctx.globalAlpha=.35+.35*Math.sin(time+i);ctx.beginPath();ctx.arc(x,y,1+(i%4),0,7);ctx.fill()}ctx.globalAlpha=1}
 if(p===3){let g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,`rgb(${c1})`);g.addColorStop(.5,`rgb(${c2})`);g.addColorStop(1,`rgb(${c1})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.35;for(let x=-100;x<W+100;x+=45){ctx.fillStyle='#fff';ctx.fillRect(x+Math.sin(time)*40,0,7,H)}ctx.globalAlpha=1}
 if(p===4){let g=ctx.createRadialGradient(420,70,0,420,70,260);g.addColorStop(0,'#fff');g.addColorStop(.04,`rgb(${c2})`);g.addColorStop(.2,`rgb(${c1})`);g.addColorStop(1,'#020207');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<35;i++){let a=i*.45+time*.4,r=30+i*6;ctx.fillStyle=i%2?'#fff':`rgb(${c2})`;ctx.fillRect(420+Math.cos(a)*r,70+Math.sin(a)*r,2,2)}}
 if(p===5){ctx.fillStyle='#0b0b0d';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=5){ctx.fillStyle=`rgba(255,255,255,${.025+.02*Math.sin(time*4+y)})`;ctx.fillRect(0,y,W,1)}ctx.fillStyle=`rgb(${c1})`;ctx.globalAlpha=.35;ctx.fillRect(((time*100)%800)-200,0,180,H);ctx.globalAlpha=1}
 // text
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 58px ${$('font').value}, sans-serif`;
 let effect=$('effect').value;
 if(effect==='rainbow'){let gr=ctx.createLinearGradient(100,0,500,0);gr.addColorStop(0,'#ff0080');gr.addColorStop(.5,'#fff');gr.addColorStop(1,'#00e5ff');ctx.fillStyle=gr}
 else if(effect==='bw')ctx.fillStyle='#fff';
 else ctx.fillStyle='#fff';
 ctx.shadowColor=`rgb(${c2})`;ctx.shadowBlur=18;
 ctx.fillText(name,300,120+Math.sin(time*2)*4);
 if(effect==='glitch'){ctx.shadowBlur=0;ctx.globalAlpha=.7;ctx.fillStyle=`rgb(${c1})`;ctx.fillText(name,296+Math.sin(time*15)*4,120);ctx.fillStyle=`rgb(${c2})`;ctx.fillText(name,304-Math.sin(time*13)*4,120);ctx.globalAlpha=1}
 ctx.shadowBlur=0;
 if($('overlay').checked){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.strokeRect(1,1,598,238)}
 if(effect==='bw'){let img=ctx.getImageData(0,0,W,H),d=img.data;for(let i=0;i<d.length;i+=4){let v=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=v}ctx.putImageData(img,0,0)}
}
let start=performance.now();
function loop(now){
  if(!document.getElementById('remotePreview')) draw(now-start);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(templates[0][1]) showRemoteGif(templates[0][1],templates[0][0]);

$('png').onclick=()=>{let a=document.createElement('a');a.href=cvs.toDataURL('image/png');a.download='conflux-banner.png';a.click()};
$('render').onclick=async()=>{
 if(!window.GIF){$('status').textContent='GIF.js chưa tải được. Kiểm tra Internet rồi thử lại.';return}
 $('status').textContent='Đang render GIF...';
 const gif=new GIF({workers:2,quality:8,width:600,height:240,workerScript:'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'});
 for(let i=0;i<24;i++){draw(i*100);gif.addFrame(cvs,{copy:true,delay:100})}
 gif.on('finished',blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='conflux-banner.gif';a.click();$('status').textContent='Render xong — đã tạo GIF 600×240.'});
 gif.on('progress',p=>{$('status').textContent=`Đang render ${(p*100).toFixed(0)}%...`});
 gif.render();
}
</script>
</body>
</html>
