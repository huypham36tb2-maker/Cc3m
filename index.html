<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creavite Style GIF Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080c;color:#f5f5f7;font-family:Inter,Arial,sans-serif}
header{height:64px;border-bottom:1px solid #22232c;background:#0b0b10;display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:4}
.logo{font-weight:900;font-size:19px}.logo span{color:#8b5cf6}.nav{color:#a5a5af;font-size:13px;display:flex;gap:22px}
.wrap{max-width:1320px;margin:auto;padding:28px 20px}.hero h1{font-size:38px;margin:0 0 7px}.hero p{color:#8f909a;margin:0 0 25px}
.layout{display:grid;grid-template-columns:245px 1fr 285px;gap:16px}.panel{background:#111117;border:1px solid #252631;border-radius:15px;padding:14px}
h3{font-size:13px;margin:2px 0 12px}.templates{display:grid;gap:9px}.tpl{border:1px solid #292a35;background:#17171e;border-radius:10px;padding:6px;display:flex;align-items:center;gap:9px;color:white;text-align:left;cursor:pointer}.tpl.active{border-color:#8b5cf6;box-shadow:0 0 0 1px #8b5cf644}.thumb{width:75px;height:43px;border-radius:7px;overflow:hidden;position:relative;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.tpl span{font-size:12px;font-weight:700}.stage{display:flex;flex-direction:column;gap:12px}.canvasbox{background:#07070a;border:1px solid #252631;border-radius:15px;padding:15px;min-height:480px;display:grid;place-items:center}.canvasbox img{max-width:100%;max-height:600px;border-radius:8px;box-shadow:0 15px 60px #000}.empty{color:#777;font-size:13px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:11px;color:#999}.field input,.field select{background:#09090d;color:#eee;border:1px solid #292a35;border-radius:9px;padding:10px;outline:0;width:100%}.color{height:40px;padding:3px!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:9px;padding:11px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:linear-gradient(90deg,#8b5cf6,#06b6d4);color:#fff}.secondary{background:#22232d;color:#fff;border:1px solid #30313d}.status{font-size:11px;color:#777;margin-top:10px;line-height:1.4}.badge{font-size:9px;color:#aaa;margin-left:auto}.check{display:flex;gap:7px;align-items:center;font-size:12px;color:#aaa}@media(max-width:1050px){.layout{grid-template-columns:210px 1fr}.right{grid-column:1/-1}.right .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:none}.templates{grid-template-columns:1fr 1fr}.canvasbox{min-height:280px}.right .fields{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo"><span>✦</span> CREAVITE STYLE</div><div class="nav"><span>GIF Maker</span><span>Discord</span><span>Templates</span></div></header>
<main class="wrap"><section class="hero"><h1>Animated GIF Maker</h1><p>Chọn một mẫu giống bộ GIF của bạn, thay nội dung và xuất GIF.</p></section>
<div class="layout">
<aside class="panel"><h3>TEMPLATE</h3><div class="templates" id="templates"></div></aside>
<section class="stage"><div class="canvasbox"><img id="preview" alt=""><div id="empty" class="empty">Chọn template để xem preview</div></div></section>
<aside class="panel right"><h3>TEXT & STYLE</h3><div class="fields">
<div class="field"><label>NỘI DUNG</label><input id="text" value="HUY PHAM" maxlength="35"></div>
<div class="row"><div class="field"><label>MÀU CHỮ</label><input class="color" id="color" type="color" value="#ffffff"></div><div class="field"><label>MÀU GLOW</label><input class="color" id="glow" type="color" value="#ff3355"></div></div>
<div class="field"><label>FONT</label><select id="font"><option value="Arial Black">Arial Black</option><option value="Impact">Impact</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option></select></div>
<div class="field"><label>VỊ TRÍ</label><select id="pos"><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option></select></div>
<label class="check"><input id="bold" type="checkbox" checked> Chữ đậm</label>
<button class="btn primary" id="export">Xuất GIF</button>
<button class="btn secondary" id="downloadSource">Tải GIF mẫu</button>
<div class="status" id="status">Preview dùng đúng GIF mẫu đã cung cấp. Khi xuất, hệ thống phủ chữ tùy chỉnh lên từng frame.</div></div></aside>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/dist/gifuct.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const files=[
 ['Cloud Glow','standard 5.gif'],['RGB Glitch','standard 6.gif'],['Dark Glitch','standard 2.gif'],
 ['Pink Storm','standard 7.gif'],['Fire / Ember','standard 4.gif'],['Black Texture','standard.gif'],['Red Motion','standard 3.gif']
];
let current=0,frames=[],meta=null;
const $=id=>document.getElementById(id);
files.forEach((x,i)=>{let b=document.createElement('button');b.className='tpl '+(!i?'active':'');b.innerHTML='<div class="thumb"><img src="assets/'+encodeURIComponent(x[1])+'"></div><span>'+x[0]+'</span><small class="badge">GIF</small>';b.onclick=()=>select(i);$('templates').appendChild(b)});
function select(i){current=i;document.querySelectorAll('.tpl').forEach((x,j)=>x.classList.toggle('active',i===j));$('preview').src='assets/'+encodeURIComponent(files[i][1]);$('empty').style.display='none';$('downloadSource').onclick=()=>{let a=document.createElement('a');a.href='assets/'+encodeURIComponent(files[i][1]);a.download=files[i][1];a.click()}}
select(0);
$('text').oninput=()=>{};
async function decode(){
 const r=await fetch('assets/'+encodeURIComponent(files[current][1])); const buf=await r.arrayBuffer();
 const gif=window.gifuct.parseGIF(buf); const dec=window.gifuct.decompressFrames(gif,true);
 return {frames:dec,width:gif.lsd.width,height:gif.lsd.height};
}
function hex(h){return h}
async function exportGif(){
 $('status').textContent='Đang đọc frames...';
 try{
  let d=await decode(); let W=d.width,H=d.height;
  const out=new GIF({workers:2,quality:8,width:W,height:H,workerScript:'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'});
  let c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=W;c.height=H;
  const tmp=document.createElement('canvas'),tc=tmp.getContext('2d');tmp.width=W;tmp.height=H;
  for(let i=0;i<d.frames.length;i++){
   let f=d.frames[i],img=ctx.createImageData(W,H);
   // gifuct-js returns RGBA patch + dims; compose onto a persistent canvas
   if(i===0) tc.clearRect(0,0,W,H);
   let patch=tc.createImageData(f.dims.width,f.dims.height);
   patch.data.set(f.patch);tc.putImageData(patch,f.dims.left,f.dims.top);
   ctx.clearRect(0,0,W,H);ctx.drawImage(tmp,0,0);
   let text=$('text').value||'HUY PHAM', size=Math.max(18,Math.min(W/7,42));
   ctx.save();ctx.font=($('bold').checked?'900 ':'700 ')+size+'px '+$('font').value+',sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
   let y=$('pos').value==='top'?H*.25:$('pos').value==='bottom'?H*.75:H*.5;
   ctx.shadowColor=$('glow').value;ctx.shadowBlur=18;ctx.fillStyle=$('color').value;ctx.fillText(text,W/2,y);
   ctx.shadowBlur=5;ctx.fillText(text,W/2,y);ctx.restore();
   out.addFrame(c,{copy:true,delay:(f.delay||8)*10});
   $('status').textContent=`Đang render ${Math.round((i+1)/d.frames.length*100)}%...`;
  }
  out.on('finished',blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='custom-'+files[current][1];a.click();$('status').textContent='Xong — GIF đã xuất.'});
  out.render();
 }catch(e){console.error(e);$('status').textContent='Không thể render: '+e.message}
}
$('export').onclick=exportGif;
</script></body></html>
